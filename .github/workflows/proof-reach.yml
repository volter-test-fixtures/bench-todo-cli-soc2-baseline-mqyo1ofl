name: proof-reach
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: install the shipped egress-guard (proxy from MODEL_PROXY_URL)
        env: { MODEL_PROXY_URL: "https://volter-agent-model-proxy.aaron-0ed.workers.dev" }
        run: bash scripts/egress-guard.sh
      - name: every AGENT egress target must remain reachable; example.com must be DENIED
        run: |
          set +e
          for u in https://volter-agent-model-proxy.aaron-0ed.workers.dev/healthz https://registry.npmjs.org/ https://api.github.com https://codeload.github.com https://objects.githubusercontent.com; do
            curl -sS --max-time 12 -o /dev/null -w "$u -> %{http_code}\n" "$u"
          done
          curl -sS --max-time 12 -o /dev/null https://example.com; rc=$?
          echo "BLOCKED-CHECK: example.com exit=$rc -> $([ $rc -eq 0 ] && echo LEAK-FAILOPEN || echo DENIED)"
