name: proof-egress
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  egress:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: allowlisted egress SUCCEEDS
        run: curl -sS --max-time 15 -o /dev/null -w "api.github.com -> HTTP %{http_code}\n" https://api.github.com
      - name: NON-allowlisted egress is DENIED (expect failure)
        run: |
          if curl -sS --max-time 15 -o /dev/null https://example.com 2>/tmp/e; then
            echo "::error::egress to example.com SUCCEEDED — lockdown FAILED"; exit 1
          else
            echo "DENIED as expected: $(cat /tmp/e | head -1)"; echo "PROOF: non-allowlisted egress blocked by harden-runner"
          fi
