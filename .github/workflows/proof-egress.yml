name: proof-egress
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  egress:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: "api.github.com:443 github.com:443 agent.api.stepsecurity.io:443 prod.app-api.stepsecurity.io:443"
      - run: |
          set +e
          curl -sS --max-time 12 -o /dev/null -w "api.github.com -> %{http_code}\n" https://api.github.com
          curl -sS --max-time 12 -o /dev/null https://example.com; rc=$?
          echo "PRIVATE-CELL: example.com curl exit=$rc -> $([ $rc -eq 0 ] && echo ALLOWED-FAILOPEN || echo DENIED-ENFORCED)"
