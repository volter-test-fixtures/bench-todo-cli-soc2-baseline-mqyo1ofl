name: proof-sod-develop
on: { workflow_dispatch: {} }
permissions: { contents: write, pull-requests: write }   # the develop capability grant — NO statuses:write
jobs:
  sod:
    runs-on: ubuntu-latest
    steps:
      - name: develop token CANNOT post a commit status (expect 403)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh api -X POST "repos/{owner}/{repo}/statuses/${GITHUB_SHA}" -f state=success -f context=proof-illegal 2>/tmp/s; then
            echo "::error::develop token POSTED a status — SoD FAILED"; exit 1; fi
          echo "DENIED: $(grep -iE '403|Resource not accessible|permission' /tmp/s | head -1)"; echo "PROOF: code:propose token cannot post statuses"
