name: proof-egress-guard
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: install self-managed egress allowlist (no account)
        run: bash scripts/egress-guard.sh
      - name: allowlisted vs non-allowlisted egress
        run: |
          set +e
          curl -sS --max-time 12 -o /dev/null -w "api.github.com -> %{http_code}\n" https://api.github.com
          curl -sS --max-time 12 -o /dev/null https://example.com; rc=$?
          echo "PRIVATE+GUARD: example.com curl exit=$rc -> $([ $rc -eq 0 ] && echo ALLOWED-FAILOPEN || echo DENIED-ENFORCED)"
